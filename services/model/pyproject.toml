[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herhealth-model"
version = "0.1.0"
description = "CPU-only retrieval service: bge-m3 embeddings over the reviewed passage index, plus the guarded web-search fallback (docs/adr/0012)."
requires-python = ">=3.12"
dependencies = [
    "herhealth-contracts",
    # PassageIndex, SentenceTransformerEmbedder, split_sentences — this service
    # is the "later services/model" the retrieval contracts docstrings already
    # anticipated importing herhealth_data directly. services/backend must
    # never do this; this service exists so it does not have to.
    #
    # Both extras, not just retrieval: the guarded web fallback (ADR 0012 §3)
    # reuses ingest's clean_html/RobotsPolicy/http_get on a live fetch, rather
    # than re-implementing HTML cleaning and robots compliance a second time.
    "herhealth-data[retrieval,ingest]",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv.sources]
herhealth-contracts = { workspace = true }
herhealth-data = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/herhealth_model"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["herhealth_model", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

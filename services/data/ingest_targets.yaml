  # ---------------------------------------------------------------------------
  # NHS — Crown copyright, status citable_only.
  #
  # CITABLE_ONLY IS UNCHANGED BY FETCHING THESE. Text may appear in a
  # source_quote with attribution; it must never enter passages.parquet. That is
  # a licence constraint, not a politeness one, and the validator enforces it
  # independently of how the text was obtained.
  #
  # Every request is checked against nhs.uk/robots.txt first, by RobotsPolicy,
  # which refuses a disallowed path before any request is made. Note robots.txt
  # disallows "/Conditions/" with a capital C while the live URLs are lowercase;
  # matching is case-sensitive per RFC 9309, so the outcome is whatever the
  # standard says rather than whatever we guess it meant. The fetch record
  # states which it was.
  #
  # These are the pages already read manually, so fetching them adds
  # reproducibility rather than new content.
  # ---------------------------------------------------------------------------
  - source_id: nhs
    slug: pelvic_pain
    url: https://www.nhs.uk/symptoms/pelvic-pain/
    licence: Crown copyright. Quote with attribution only; never redistribute.

  - source_id: nhs

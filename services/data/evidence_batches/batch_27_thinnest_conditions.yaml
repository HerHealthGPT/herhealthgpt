# Batch 27 — the thinnest conditions, from pages already in the corpus.
#
# DRAFTED 2026-10-19 by Claude, reading build/clean/{womenshealth,medlineplus}
# directly. APPROVED 2026-10-19 by the repo owner, who read each quote in its
# paragraph on the fetched page and confirmed it supports its row (CLAUDE.md,
# "Verification protocol"). That is a provenance check, not a clinical review;
# the knowledge base stays source-traceable, not clinician-adjudicated.
#
# WHY THIS BATCH
#
# CLAUDE.md names bacterial_vaginosis, infertility, inherited_bleeding_disorder
# and iron_deficiency_anaemia (3 rows each) as where the differential is most
# likely to be weak. All their pages were read again for sentences connecting
# them to a feature they have no row for. Few survive the rules, and that is
# the finding:
#
# - pregnancy_status, feeling_faint and difficulty_breathing are red-flag-only
#   and never carry an evidence row, so "BV is common during pregnancy"
#   (womenshealth) and "You may be short of breath" (MedlinePlus, anaemia)
#   are not used.
# - Itching in BV stays unwritten: NHS and womenshealth contradict each other
#   (see batch 24 and discharge_smell's note).
# - "Anemia can make you feel tired, cold, dizzy, and irritable" (MedlinePlus)
#   is not mapped to low_mood_or_anxiety: irritable is neither, and the row
#   would be an inference.
# - "very overweight or underweight" (MedlinePlus, infertility) describes a
#   state, not the weight_change feature; not mapped.
# - Bruising and nosebleeds (bleeding disorders) have no feature.
#
# What remains is four rows.
#
# INFERTILITY AND AGE: rows 1-3 follow the encoding batches 11 and 18 used for
# open age thresholds (adenomyosis "over the age of 30", POI "before 40"): one
# weak row per band the threshold covers, all citing the same sentence. 55_plus
# is left out on purpose: after menopause the question is not infertility, and
# the source's own advice ("Women 35 or older should see their doctors after six
# months of trying") is about women still trying. A reviewer may disagree.
#
# SOAKING HOURLY: the existing heavy row for inherited_bleeding_disorder does not
# fire for bleeding_heaviness=soaking_hourly, because evidence matches on the
# exact value, so a woman soaking a pad every hour gets less support for a
# bleeding disorder than one with plain heavy periods. The same page lists
# hourly soaking as how to tell heavy bleeding, and says heavy periods may mean
# a bleeding disorder. Weak, because it is that two-step reading of one page.

approved: true
reviewed_on: 2026-10-19

rows:
  - condition_id: infertility
    feature_id: age_band
    value: 30_to_39
    strength: weak_support
    source_id: womenshealth
    source_quote: >-
      A woman's chances of having a baby decrease rapidly every year after the
      age of 30.
    note: >-
      First of three identical-strength rows for the open "after the age of 30"
      threshold, encoded as batches 11 and 18 did. Weak: an age-related risk, not
      a presenting sign.
  - condition_id: infertility
    feature_id: age_band
    value: 40_to_44
    strength: weak_support
    source_id: womenshealth
    source_quote: >-
      A woman's chances of having a baby decrease rapidly every year after the
      age of 30.
    note: Second of three. See 30_to_39.
  - condition_id: infertility
    feature_id: age_band
    value: 45_to_54
    strength: weak_support
    source_id: womenshealth
    source_quote: >-
      A woman's chances of having a baby decrease rapidly every year after the
      age of 30.
    note: >-
      Third of three. See 30_to_39. Overlaps perimenopause's strong 45_to_54 row;
      both can be live, which is expected.
  - condition_id: inherited_bleeding_disorder
    feature_id: bleeding_heaviness
    value: soaking_hourly
    strength: weak_support
    source_id: womenshealth
    source_quote: Soak through a pad or tampon every hour or two
    note: >-
      Listed on the bleeding-disorders page under "How can I tell if I have heavy
      bleeding during my menstrual period?", the same page that says "As many as
      one in 10 women with heavy periods may have some type of bleeding
      disorder." Without it the soaking_hourly value carried no support for this
      condition while plain heavy did. Weak: a two-step reading of one page.

# Batch 01 — PCOS core, plus the first two fibroid rows.
#
# Reviewed and approved 2026-08-03.
#
# Rows are authored here and knowledge/evidence.csv is GENERATED by
# `make evidence`. Never hand-edit the CSV: every source_quote contains commas,
# and one stray character silently changes a clinical claim.
#
# Every quote below is verbatim from the cited source. If a quote cannot be
# found in the source text under build/clean/, the row is wrong and must be
# deleted rather than softened.

batch: 01
covers: [pcos, uterine_fibroids]

# Only approved batches contribute rows to knowledge/evidence.csv. A draft is
# still parsed and validated — a bad row should fail now, not on the morning
# someone approves it — but it contributes nothing until this is true.
approved: true
reviewed_on: 2026-08-03

rows:
  # -------------------------------------------------------------------------
  # PCOS — cycle pattern. This is the axis the whole differential turns on.
  # -------------------------------------------------------------------------

  - condition_id: pcos
    feature_id: cycle_regularity
    value: irregular
    strength: strong_support
    source_id: medlineplus
    source_quote: Irregular or missed menstrual periods.
    note: >-
      Listed first among the symptoms of PCOS, and corroborated by NICHD, which
      calls absence of ovulation a characteristic feature.

  - condition_id: pcos
    feature_id: cycle_regularity
    value: absent
    strength: strong_support
    source_id: nichd
    source_quote: >-
      Menstrual irregularities: No menstrual periods—called amenorrhea
    note: >-
      Absent periods are named explicitly, not merely implied by "irregular".

  - condition_id: pcos
    feature_id: cycle_regularity
    value: regular
    strength: argues_against
    source_id: nichd
    source_quote: >-
      Because the characteristic features of PCOS (also known as Polyendocrine
      Metabolic Ovary Syndrome [PMOS])—absence of ovulation, indicated by
      irregular menstrual periods or no periods at all; high androgen levels;
      and growths in one or both ovaries, often clumps of ovarian follicles that
      have stopped developing—are wide ranging, so, too, are the symptoms of the
      condition.
    note: >-
      THE ELIMINATION ROW. The source frames absence of ovulation as a
      CHARACTERISTIC feature and states it is indicated by irregular or absent
      periods, so regular cycles argue against — this is explicit framing, not
      inference from a symptom list, which the protocol forbids. MedlinePlus
      corroborates diagnostically: "People with PCOS usually have at least two
      of these problems: Not ovulating...". Without this row PCOS never drops
      out of the differential and elimination does not work.

  # -------------------------------------------------------------------------
  # PCOS — androgenic features
  # -------------------------------------------------------------------------

  - condition_id: pcos
    feature_id: excess_hair_growth
    value: "yes"
    strength: strong_support
    source_id: medlineplus
    source_quote: Too much hair on the face, chest, stomach, or thighs.
    note: >-
      Named as a main sign on both sources; NICHD calls it hirsutism and ties it
      to high androgen levels, one of the three characteristic features.

  - condition_id: pcos
    feature_id: acne_or_oily_skin
    value: "yes"
    strength: weak_support
    source_id: medlineplus
    source_quote: Severe acne which may be hard to treat.
    note: >-
      Listed, but not framed as characteristic, so weak rather than strong. Acne
      is common enough in the general population that treating it as strong
      support would raise PCOS on very little.

  - condition_id: pcos
    feature_id: weight_change
    value: gain
    strength: weak_support
    source_id: medlineplus
    source_quote: Obesity , weight gain, or trouble losing weight.
    note: >-
      IMPERFECT MAPPING, deliberately weak. The source names obesity, which is a
      state rather than a change, alongside weight gain, which is a change. Our
      feature captures change only. Weak support reflects that the row covers
      part of what the source says, not all of it.

  - condition_id: pcos
    feature_id: difficulty_conceiving
    value: "yes"
    strength: weak_support
    source_id: medlineplus
    source_quote: >-
      Infertility . PCOS is one of the most common causes of infertility. But
      many women with PCOS can still get pregnant.
    note: >-
      Weak despite strong language, because the same sentence qualifies it:
      "many women with PCOS can still get pregnant". The source states a
      population-level association, not a per-person sign.

  - condition_id: pcos
    feature_id: cycle_length
    value: over_35_days
    strength: weak_support
    source_id: nichd
    source_quote: Skipped periods—called oligomenorrhea
    note: >-
      Skipped periods lengthen the interval between them. Weak because the
      source names the pattern rather than a day threshold, so the mapping to
      our over_35_days bucket is ours.

  # -------------------------------------------------------------------------
  # Uterine fibroids — bleeding
  # -------------------------------------------------------------------------

  - condition_id: uterine_fibroids
    feature_id: bleeding_heaviness
    value: heavy
    strength: strong_support
    source_id: medlineplus
    source_quote: Heavy or painful periods or bleeding between periods
    note: >-
      First symptom listed, and corroborated by NICHD ("Heavy bleeding or
      painful periods") and by the NHS heavy periods page, which names fibroids
      among the causes.

  - condition_id: uterine_fibroids
    feature_id: bleeding_between_periods
    value: "yes"
    strength: weak_support
    source_id: medlineplus
    source_quote: Heavy or painful periods or bleeding between periods
    note: >-
      Same sentence as the row above, which is legitimate — one source sentence
      supports two cells. Weak rather than strong because bleeding between
      periods appears last in a list of alternatives rather than being
      emphasised.

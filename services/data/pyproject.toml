[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herhealth-data"
version = "0.1.0"
description = "Ingestion, knowledge validation and the evaluation harness for HerHealthGPT."
requires-python = ">=3.12"
dependencies = [
    "herhealth-contracts",
    # uv installs a python-build-standalone interpreter with no CA bundle,
    # so urllib cannot verify any HTTPS certificate without this.
    "certifi>=2024.2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

# Kept out of the base install so `make validate` does not drag in pyarrow.
# Fetching needs none of these — it uses stdlib urllib. These are for the clean
# and build stages: parsing HTML and writing the passage corpus.
[project.optional-dependencies]
ingest = [
    # HTML parsing for the clean stage. Chosen over a heuristic main-content
    # extractor (trafilatura, readability) deliberately: those reflow and
    # paraphrase, and every source_quote must be a VERBATIM sentence from the
    # source. We need control over what is dropped, not a black box.
    "beautifulsoup4>=4.12",
    # Parser backend for bs4. Faster and far more tolerant of malformed markup
    # than the stdlib html.parser.
    "lxml>=5.2",
    "pyarrow>=16.0",
]

# Test/lint tooling is declared once, in the workspace root's dev group.

[project.scripts]
herhealth-data = "herhealth_data.cli:main"

[tool.uv.sources]
herhealth-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/herhealth_data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# conftest is our own test-support module, not a third-party package.
known-first-party = ["herhealth_data", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

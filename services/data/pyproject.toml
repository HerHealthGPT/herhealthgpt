[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herhealth-data"
version = "0.1.0"
description = "Ingestion, knowledge validation and the evaluation harness for HerHealthGPT."
requires-python = ">=3.12"
dependencies = [
    "herhealth-contracts",
    # uv installs a python-build-standalone interpreter with no CA bundle,
    # so urllib cannot verify any HTTPS certificate without this.
    "certifi>=2024.2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

# Kept out of the base install so `make validate` does not drag in pyarrow.
# Fetching needs none of these — it uses stdlib urllib. These are for the clean
# and build stages: parsing HTML and writing the passage corpus.
[project.optional-dependencies]
ingest = [
    # HTML parsing for the clean stage. Chosen over a heuristic main-content
    # extractor (trafilatura, readability) deliberately: those reflow and
    # paraphrase, and every source_quote must be a VERBATIM sentence from the
    # source. We need control over what is dropped, not a black box.
    "beautifulsoup4>=4.12",
    # Parser backend for bs4. Faster and far more tolerant of malformed markup
    # than the stdlib html.parser.
    "lxml>=5.2",
    "pyarrow>=16.0",
]

# Semantic search over the cleaned corpus. Split from `ingest` because the two
# run at different times and the model weights are large: authoring proposals
# needs this, validating knowledge does not.
retrieval = [
    # The index is a normalised matrix and an exhaustive dot product. At a few
    # thousand sentences that is exact, fast, and needs no index-building step —
    # FAISS earns its keep somewhere above ~100k vectors, not here.
    "numpy>=1.26",
    # Declared directly only so that the CPU-index source below applies: uv
    # applies tool.uv.sources to DIRECT dependencies, and torch otherwise arrives
    # only through sentence-transformers. No upper bound; uv.lock pins the version.
    "torch>=2.0",
    # Wraps BAAI/bge-m3. Chosen on published Arabic RAG results; see ADR 0010.
    # Imported lazily, so this is only needed when actually embedding.
    "sentence-transformers>=3.0",
]

# Test/lint tooling is declared once, in the workspace root's dev group.

[project.scripts]
herhealth-data = "herhealth_data.cli:main"

[tool.uv.sources]
herhealth-contracts = { workspace = true }
# Linux only: Windows/macOS wheels on PyPI are already CPU builds. The index
# itself is declared in the workspace root pyproject.toml.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/herhealth_data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# conftest is our own test-support module, not a third-party package.
known-first-party = ["herhealth_data", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herhealth-data"
version = "0.1.0"
description = "Ingestion, knowledge validation and the evaluation harness for HerHealthGPT."
requires-python = ">=3.12"
dependencies = [
    "herhealth-contracts",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

# Kept out of the base install so `make validate` does not drag in pyarrow.
# Phase 4 (ingestion + parquet corpus) needs these; phases 1-3 do not.
[project.optional-dependencies]
ingest = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "pyarrow>=16.0",
]

# Test/lint tooling is declared once, in the workspace root's dev group.

[project.scripts]
herhealth-data = "herhealth_data.cli:main"

[tool.uv.sources]
herhealth-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/herhealth_data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

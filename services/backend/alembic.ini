# Alembic configuration for the backend database.
#
# The database URL is NOT set here. It is injected at run time: the test harness
# sets it to a throwaway container, and a real deployment sets it from the same
# HERHEALTH_DATABASE_URL the app reads. A URL committed to this file is a URL
# that eventually points somewhere it should not.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Alembic uses a synchronous connection to run migrations; psycopg 3 speaks both
# sync and async, so this shares the app's one driver.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

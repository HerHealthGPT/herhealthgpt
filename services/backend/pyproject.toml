[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herhealth-backend"
version = "0.1.0"
description = "Triage, tracker, directory, visit prep, retrieval, safety and orchestration."
requires-python = ">=3.12"
dependencies = [
    "herhealth-contracts",
    "pyyaml>=6.0",  # the CLI reads case files
]

# FastAPI, the model client and retrieval arrive with the API layer. The triage
# core deliberately has no dependency beyond the contracts package: it must be
# runnable from a test or a CLI with no server, no GPU and no network, because
# that is what makes the evaluation harness possible.

[project.scripts]
herhealth-triage = "herhealth_backend.triage.cli:main"
herhealth-eval = "herhealth_backend.evaluation.cli:main"

[project.optional-dependencies]
# The retriever (triage/retrieval.py, ADR 0017). An extra of its own so the
# offline suite can install it without the web layer. No model weights: the
# embedder and the reranker are HTTP calls to vLLM.
retrieval = [
    "numpy>=1.26",
    "faiss-cpu>=1.9",
    "langchain-core>=1.0",
    "langchain-community>=0.4",
    "langchain-openai>=1.0",
    "httpx>=0.27",
]

# The web/runtime layer. Kept an extra, not a base dependency, so the triage
# core stays importable with none of it present — no server, no database driver,
# no ORM — which is the property the evaluation harness relies on.
api = [
    "herhealth-backend[retrieval]",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # OpenRouterReasoningClient and the vLLM client (triage/clients.py,
    # ADR 0012) — the "model client and retrieval" this extra's own comment
    # above already named before either client existed.
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    # psycopg 3 does both sync and async, so the app engine, Alembic and the
    # test container's readiness check all share one driver.
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # argon2id credential hashing (Accounts, #8) and EmailStr validation on the
    # registration request.
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    # Signing access tokens (Accounts, #9) — one algorithm, one format, none of
    # a JWT library's header/algorithm negotiation. See app/accounts/tokens.py.
    "itsdangerous>=2.2",
    # SES-backed verification email (Accounts, #10) — the boto3 SES client is
    # sync, run off the event loop the same way passwords.py runs argon2id.
    # ConsoleEmailSender needs none of this; only selecting HERHEALTH_EMAIL_SENDER=ses does.
    "boto3>=1.34",
    # Verifying a Google ID token's signature and audience (Accounts, #11) —
    # Google's own recommended library for exactly this. Needed even when
    # Google sign-in is unconfigured, since UnconfiguredGoogleTokenVerifier
    # lives beside GoogleOAuthTokenVerifier in the same module.
    "google-auth>=2.30",
    # google-auth's HTTP transport (google.auth.transport.requests, imported by
    # google_identity.py) needs requests, which google-auth does not install by
    # itself. Without it the app fails at import, which broke the first deploy's
    # migration step.
    "requests>=2.31",
]

[tool.uv.sources]
herhealth-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/herhealth_backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["herhealth_backend", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app tests are async; the triage tests are plain sync functions and are
# unaffected. "auto" saves marking every async test by hand.
asyncio_mode = "auto"

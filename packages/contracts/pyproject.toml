[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herhealth-contracts"
version = "0.1.0"
description = "Shared schemas, error codes and safety policy for HerHealthGPT."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    # For loading.py. The knowledge files are YAML, and both services load them,
    # so the loader lives here and its parser has to come with it.
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/herhealth_contracts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# mypy runs strict here and nowhere else: these schemas are the single
# definition every other service validates against.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

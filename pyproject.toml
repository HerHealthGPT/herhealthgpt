# Workspace root. Not itself an installable package — it exists so that one
# `uv sync` produces the same environment on every machine, from one lockfile.
#
# uv.lock is committed and is the source of truth for the environment. CI runs
# `uv sync --locked`, which fails rather than silently re-resolving if the lock
# and the pyproject files have drifted apart.

[project]
name = "herhealthgpt"
version = "0.0.0"
description = "HerHealthGPT monorepo workspace root."
requires-python = ">=3.12"
dependencies = [
    "herhealth-contracts",
    "herhealth-data",
    "herhealth-backend",
]

# Re-exposed from the data service so `uv sync --extra ingest` works from the
# workspace root and keeps the dev group. Syncing the member directly with
# `--package` drops dev tooling.
[project.optional-dependencies]
ingest = ["herhealth-data[ingest]"]
retrieval = ["herhealth-data[retrieval]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contracts",
    "services/data",
    "services/backend",
]

# The two local packages resolve to the working tree, never to an index.
[tool.uv.sources]
herhealth-contracts = { workspace = true }
herhealth-data = { workspace = true }
herhealth-backend = { workspace = true }

# Tooling shared by every member. Installed by default; `uv sync --no-dev`
# gives the runtime-only environment.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # mypy runs strict on packages/contracts, which imports yaml. Without stubs
    # the loader is untyped there and strict mode refuses it.
    "types-PyYAML>=6.0",
]

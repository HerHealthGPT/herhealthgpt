# Workspace root. Not itself an installable package — it exists so that one
# `uv sync` produces the same environment on every machine, from one lockfile.
#
# uv.lock is committed and is the source of truth for the environment. CI runs
# `uv sync --locked`, which fails rather than silently re-resolving if the lock
# and the pyproject files have drifted apart.

[project]
name = "herhealthgpt"
version = "0.0.0"
description = "HerHealthGPT monorepo workspace root."
requires-python = ">=3.12"
dependencies = [
    "herhealth-contracts",
    "herhealth-data",
    "herhealth-backend",
    "herhealth-model",
]

# Re-exposed from the data service so `uv sync --extra ingest` works from the
# workspace root and keeps the dev group. Syncing the member directly with
# `--package` drops dev tooling.
[project.optional-dependencies]
ingest = ["herhealth-data[ingest]"]
retrieval = ["herhealth-data[retrieval]"]
# Re-exposed so `uv sync --extra api` from the root installs the backend's web
# layer (FastAPI, SQLAlchemy, psycopg, Alembic) into the workspace environment.
api = ["herhealth-backend[api]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contracts",
    "services/data",
    "services/backend",
    "services/model",
]

# The local packages resolve to the working tree, never to an index.
[tool.uv.sources]
herhealth-contracts = { workspace = true }
herhealth-data = { workspace = true }
herhealth-backend = { workspace = true }
herhealth-model = { workspace = true }

# torch on Linux comes from PyTorch's CPU index (services/data declares the
# source). PyPI's Linux wheel depends on the CUDA 13 stack (nvidia-*, triton:
# ~1.5 GB compressed, 10 packages), and none of our hosts has a GPU: that is dead
# weight in the retrieval image and in every pull. Windows and macOS keep PyPI's
# wheels, which are CPU builds already. `explicit = true` means only packages
# that name this index use it; everything else still resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Tooling shared by every member. Installed by default; `uv sync --no-dev`
# gives the runtime-only environment.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # mypy runs strict on packages/contracts, which imports yaml. Without stubs
    # the loader is untyped there and strict mode refuses it.
    "types-PyYAML>=6.0",
    # boto3 ships no py.typed marker; without stubs, backend.yml's mypy step
    # (default mode, checks services/backend/src/herhealth_backend/app) refuses
    # to import it at all (email_sender.py's SesEmailSender, Accounts #10).
    "boto3-stubs[ses]>=1.34",
    # The backend's HTTP and database tests. testcontainers starts a real
    # PostgreSQL in Docker for the session; httpx drives the app over ASGI;
    # pytest-asyncio runs the async tests. None of it touches a network or a
    # cloud account — the triage suite still runs with none of this installed.
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
]

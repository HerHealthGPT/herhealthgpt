name: deploy

# Production deploy to the single EC2 host. On a push to main that touches
# anything that ships:
#
#   1. build the three images, tagged with the git SHA (never `latest`);
#      retrieval is built from a PUBLISHED, versioned, quote-only-free index
#      pulled from S3, and the pinned bge-m3 revision
#   2. push them to ECR (tags are immutable)
#   3. upload compose.prod.yml, the Caddyfile and the deploy scripts to
#      s3://<bucket>/deploy/<sha>/
#   4. tell the host to run /opt/herhealth/deploy.sh <sha> through SSM, and wait.
#      deploy.sh migrates, switches, health-checks through Caddy, and rolls back
#      to the previous tag by itself if the check fails.
#
# Rollback by hand is `git revert` on main, which runs this same pipeline.
# `terraform apply` is NOT here; it is run manually (docs/runbooks/aws-deploy.md).
#
# This workflow does not run tests: backend.yml and data.yml do, on the PR.
# Require them as status checks on main, or untested code deploys.
#
# Repository VARIABLES this needs (Settings -> Secrets and variables -> Actions
# -> Variables; none of them is a secret):
#   AWS_DEPLOY_ROLE_ARN             terraform output deploy_role_arn
#   EC2_INSTANCE_ID                 terraform output instance_id
#   ARTIFACTS_BUCKET                terraform output artifacts_bucket
#   RETRIEVAL_INDEX_VERSION         printed by scripts/publish-index.sh
#   BGE_M3_REVISION                 40-hex HF commit; must equal the index's build-info.json
#   NEXT_PUBLIC_GOOGLE_CLIENT_ID    OPTIONAL: the Google OAuth client id (public by
#                                   design); unset means no Google sign-in

on:
  push:
    branches: [main]
    paths:
      - "services/backend/**"
      - "services/frontend/**"
      - "services/model/**"
      - "services/data/**"
      - "packages/contracts/**"
      - "knowledge/**"
      - "infra/compose.prod.yml"
      - "infra/caddy/**"
      - "infra/deploy/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through a migration.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  API_URL: https://api.herhealthgpt.org

jobs:
  deploy:
    # The trigger already limits pushes to main, but workflow_dispatch can be
    # started from any branch in the UI. Guard the job itself: this is the only
    # job in the repository that deploys, and only the main ref may run it. (The
    # deploy role's trust policy independently refuses any other ref.)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHA: ${{ github.sha }}
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      INDEX_VERSION: ${{ vars.RETRIEVAL_INDEX_VERSION }}
      BGE_M3_REVISION: ${{ vars.BGE_M3_REVISION }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required repository variables
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        # NEXT_PUBLIC_GOOGLE_CLIENT_ID is deliberately not required: unset, the
        # frontend hides Google sign-in and the backend reports it unconfigured.
        run: |
          missing=0
          for v in ROLE ARTIFACTS_BUCKET INSTANCE_ID INDEX_VERSION BGE_M3_REVISION; do
            if [ -z "${!v}" ]; then echo "::error::repository variable for $v is not set (see the header of .github/workflows/deploy.yml)"; missing=1; fi
          done
          [ "$missing" = 0 ]

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- the retrieval index: published, versioned, read-only here ----------
      - name: Fetch the published index
        run: |
          aws s3 sync "s3://${ARTIFACTS_BUCKET}/index/${INDEX_VERSION}/" build/index --only-show-errors
          test -f build/index/vectors.npy

      # Belt and braces: publish-index.sh already refused to upload any of this,
      # but an image is the last place quote-only text could slip in.
      - name: Verify the index (model, revision, no quote-only text)
        run: |
          python3 - <<'PY'
          import json, os, sys
          d = "build/index"
          manifest = json.load(open(f"{d}/manifest.json", encoding="utf-8"))
          info = json.load(open(f"{d}/build-info.json", encoding="utf-8"))
          problems = []
          if manifest.get("model_name") != "BAAI/bge-m3":
              problems.append(f"manifest model_name is {manifest.get('model_name')!r}, not BAAI/bge-m3")
          if info.get("version") != os.environ["INDEX_VERSION"]:
              problems.append(f"build-info version {info.get('version')} != RETRIEVAL_INDEX_VERSION {os.environ['INDEX_VERSION']}")
          if info.get("bge_m3_revision") != os.environ["BGE_M3_REVISION"]:
              problems.append(
                  f"the index was built with bge-m3 revision {info.get('bge_m3_revision')}, "
                  f"but BGE_M3_REVISION is {os.environ['BGE_M3_REVISION']}: weights and vectors would not match"
              )
          with open(f"{d}/passages.jsonl", encoding="utf-8") as fh:
              for n, line in enumerate(fh, 1):
                  if line.strip():
                      p = json.loads(line)
                      if p.get("may_be_ingested") is not True or p.get("source_id") == "nhs":
                          problems.append(f"passages.jsonl line {n} is quote-only ({p.get('source_id')})")
                          break
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          PY

      - uses: docker/setup-buildx-action@v3

      # ECR tags are immutable, so re-running this workflow for a commit that
      # was already pushed must skip the push rather than fail on it.
      - name: Which images already exist for this commit?
        id: exists
        run: |
          for repo in frontend backend retrieval; do
            if aws ecr describe-images --repository-name "herhealth-$repo" --image-ids "imageTag=${SHA}" >/dev/null 2>&1; then
              echo "$repo=true" >> "$GITHUB_OUTPUT"
            else
              echo "$repo=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Build and push backend
        if: steps.exists.outputs.backend != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/herhealth-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # NEXT_PUBLIC_* are inlined into the bundle at build time; they MUST be
      # build args. BACKEND_URL is baked into next.config.ts's rewrite.
      - name: Build and push frontend
        if: steps.exists.outputs.frontend != 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/herhealth-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            BACKEND_URL=http://backend:8000
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build and push retrieval
        if: steps.exists.outputs.retrieval != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/model/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/herhealth-retrieval:${{ github.sha }}
          build-args: |
            BGE_M3_REVISION=${{ vars.BGE_M3_REVISION }}
            INDEX_VERSION=${{ vars.RETRIEVAL_INDEX_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=retrieval
          cache-to: type=gha,scope=retrieval,mode=max

      - name: Upload this release's deploy files
        run: |
          dest="s3://${ARTIFACTS_BUCKET}/deploy/${SHA}"
          aws s3 cp infra/compose.prod.yml          "$dest/compose.prod.yml"    --sse AES256 --only-show-errors
          aws s3 cp infra/caddy/Caddyfile           "$dest/Caddyfile"           --sse AES256 --only-show-errors
          aws s3 cp infra/deploy/deploy.sh          "$dest/deploy.sh"           --sse AES256 --only-show-errors
          aws s3 cp infra/deploy/refresh-secrets.sh "$dest/refresh-secrets.sh"  --sse AES256 --only-show-errors
          aws s3 cp infra/deploy/caddy-data.sh      "$dest/caddy-data.sh"       --sse AES256 --only-show-errors

      - name: Deploy through SSM and wait
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name herhealth-deploy \
            --comment "deploy ${SHA}" \
            --parameters "Sha=${SHA}" \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"

          status=""
          for _ in $(seq 1 360); do # up to 60 minutes
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
          done

          echo "::group::deploy.sh output (SSM keeps the last 24,000 characters)"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["stdout"]); print(d["stderr"], file=sys.stderr)'
          echo "::endgroup::"

          if [ "$status" != "Success" ]; then
            echo "::error::deploy finished with status $status. If deploy.sh rolled back, the previous release is still serving; the output above says which."
            exit 1
          fi
          echo "release ${SHA} is live"

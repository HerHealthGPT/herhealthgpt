name: data

# Path-filtered: a frontend or model change must not trigger this workflow.
on:
  push:
    branches: [main]
    paths:
      - "services/data/**"
      - "services/backend/**"
      - "packages/contracts/**"
      - "knowledge/**"
      # scripts/tests runs under `make test`; it guards the model-serving
      # definitions, including the compose/launcher parity check.
      - "scripts/**"
      - "infra/model/**"
      - "infra/compose.model.yml"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/data.yml"
  pull_request:
    paths:
      - "services/data/**"
      - "services/backend/**"
      - "packages/contracts/**"
      - "knowledge/**"
      # scripts/tests runs under `make test`; it guards the model-serving
      # definitions, including the compose/launcher parity check.
      - "scripts/**"
      - "infra/model/**"
      - "infra/compose.model.yml"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/data.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails rather than re-resolving. CI runs the same pins a
      # teammate does, or it goes red.
      # --extra ingest: the clean-step tests import BeautifulSoup. Without it
      # test_clean.py fails at collection, which is how this was first found.
      - name: Install from lockfile
        run: uv sync --locked --extra ingest --extra retrieval

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Validate knowledge
        run: make validate

      # The demonstration cases are already asserted by the test suite. This
      # step is for the log: it prints the full trace of every consultation, so
      # the effect of a weights or ranking change is readable in the CI output
      # of the PR that made it, not only as a pass/fail.
      - name: Trace the demonstration consultations
        run: make triage-all

  # difficulty_conceiving pointed only at pcos and endometriosis.
  # ---------------------------------------------------------------------------
  - id: infertility
    label: Infertility (difficulty conceiving)
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [womenshealth, medlineplus]
    note: >-
      Two sources: womenshealth.gov/a-z-topics/infertility, one of the
      task's named new differentials; medlineplus.gov/infertility.html,
      confirmed on the first probe (2026-08-19). The two sources' prevalence
      figures differ slightly (womenshealth: "about 10 percent of women";
      MedlinePlus: "about 15% of couples") — not resolved or averaged, both
      are prevalence statements rather than diagnostic claims, and neither is
      used to set a row's strength (see the "never invent probabilities"
      rule); recorded here rather than silently picked because CLAUDE.md asks
      conflicts never be resolved silently, even where the practical stakes
      are low.

      SHAPE OF THIS CONDITION IS DIFFERENT FROM MOST OTHERS IN THE GRID: both
      sources are overwhelmingly about causes, diagnosis and treatment
      pathways, not a symptom list a user reports. The one clear
      symptom-shaped sentence is womenshealth's: "Some signs that a woman is
      not ovulating normally include irregular or absent menstrual periods" —
      which this condition's evidence batch draws on. THE HOLE THIS FILLS,
      stated directly in the same source: "Ovulation problems are often
      caused by polycystic ovarian syndrome (PCOS)... Primary ovarian
      insufficiency (POI) is another cause... Less common causes... Blocked
      fallopian tubes due to pelvic inflammatory disease, endometriosis...
      Uterine fibroids." Before this session, difficulty_conceiving pointed
      only at pcos and endometriosis (plus ovarian_cyst, STI and PID added
      this session); this condition is the general umbrella the task named,
      sitting alongside — not replacing — those more specific ones, the same
      relationship inherited_bleeding_disorder has to bleeding_heaviness.

      baseline_action is ROUTINE_APPOINTMENT: neither source frames
      infertility itself as urgent — "How long should women try to get
      pregnant before calling their doctors?... Most experts suggest at
      least one year" is explicitly a non-urgent timeline.

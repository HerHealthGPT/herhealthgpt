# conditions.yaml — everything the system may consider as an explanation.
#
# ============================================================================
# CONSIDERING A CONDITION IS NOT ASSERTING ONE.
#
# The system's output is an urgency action and cited information, never a
# conclusion about what a user has. A condition appearing here means "this may
# be worth asking about", not "this may be what you have".
# ============================================================================
#
# `icd11` is never written by hand — codes recalled from a language model are
# unreliable, and a wrong identifier is worse than an absent one because it looks
# authoritative. Every code here was resolved by `make icd` against the WHO ICD
# API, release 2026-01, which is pinned so codes cannot shift between runs. A
# condition the API could not match confidently keeps TODO_VERIFY. Three
# sentinel values, and the distinction matters:
#   TODO_VERIFY     not yet looked up; `make icd` will propose for it
#   UNRESOLVED      looked up, no correct entry exists; will not be re-proposed
#   NOT_APPLICABLE  there is no code for this, and never will be
#
# `baseline_action` is what the condition implies on its own, before any evidence
# moves it. Most sit at ROUTINE_APPOINTMENT, escalation coming only from
# red_flags.yaml. Two exceptions, both deliberate:
#   pelvic_inflammatory_disease  URGENT_SAME_DAY — NHS routes the mere suspicion
#                                of it to urgent care
#   normal_variation             SELF_CARE — the only route to that action
#
# `source_ids` resolve to sources.yaml and must number at least two, so no
# condition rests on a single document. Sources marked `citable_only` (NHS) may
# be cited here; only `available` sources may enter the passage corpus.
#
# Validated against herhealth_contracts.knowledge.ConditionsFile.

conditions:
  # The id stays `pcos` deliberately. Ids are internal keys and changing one
  # would rewrite every evidence row and break the benchmark's labels; the
  # label is what users and markers actually see, so that is what carries the
  # current name. See CONTEXT.md.
  - id: pcos
    label: >-
      Polyendocrine metabolic ovarian syndrome (PMOS), formerly polycystic
      ovary syndrome (PCOS)
    icd11: 5A80.1
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [medlineplus, nichd]
    # ICD-11 still indexes the old name, so searching our label finds nothing.
    # Recorded rather than fuzzy-matched: the authorities genuinely disagree.
    search_term: Polycystic ovary syndrome
    note: >-
      MedlinePlus: "Polycystic ovary syndrome (PCOS) is the name for set of
      symptoms that are related to an imbalance of hormones. PCOS affects the
      ovaries, as well as many other parts of the body." The same page states
      people with PCOS "usually have at least two of these problems: Not
      ovulating... High levels of androgens... Cysts in one or both ovaries",
      which is what the evidence rows key on. NICHD supplies symptom, cause and
      treatment pages under conditioninfo/.

  - id: endometriosis
    label: Endometriosis
    icd11: GA10.Z
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [medlineplus, nichd]
    note: >-
      MedlinePlus: "Endometriosis is a disease in which tissue like the lining
      of the uterus grows in other places in your body." It names the main
      symptom as "Pelvic pain, which often happens during your period".
      CAVEAT: NICHD has no conditioninfo section for endometriosis — its topic
      page is a single paragraph — so this condition rests far more heavily on
      MedlinePlus than the other two. The two-source rule is satisfied in form
      but is thin in substance here. CDC has no endometriosis page at all.

  # ---------------------------------------------------------------------------
  # The first condition whose baseline is not routine.
  # ---------------------------------------------------------------------------
  - id: pelvic_inflammatory_disease
    label: Pelvic inflammatory disease (PID)
    icd11: GA05.Z
    baseline_action: URGENT_SAME_DAY
    source_ids: [womenshealth, cdc, nhs]
    note: >-
      BASELINE IS URGENT, WHICH IS NEW. Every other condition here sits at
      ROUTINE_APPOINTMENT or below, and escalation comes only from red_flags.
      PID is different because the NHS routes the mere suspicion of it to urgent
      care: "Ask for an urgent GP appointment or get help from NHS 111 if: you
      think you have symptoms of pelvic inflammatory disease (PID)". So the
      condition being live in the differential is itself enough.

      That makes it the most important addition to the differential so far. It
      is THE urgent alternative to the phase 1 three: fever, unusual discharge
      and pelvic pain together point here rather than at endometriosis or
      fibroids, and those three features already exist and currently do very
      little work.

      CDC states the escalation trigger plainly too: "Promptly see a doctor if
      you have any genital symptoms such as an unusual sore, a smelly discharge,
      burning when peeing, or bleeding between periods." Three sources, all
      already fetched.

  - id: perimenopause
    label: Perimenopause and menopause
    icd11: GA30.Z
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [medlineplus, nhs]
    note: >-
      Included for the reason CLAUDE.md gives: without it the system
      over-suspects PCOS in women over 45, because irregular periods, weight
      change, low mood and thinning hair all appear under both. Age is what
      separates them, and age_band already exists.

      A natural life stage rather than a disease, so the baseline is a judgement
      call. NHS calls it "a natural part of life" but still routes symptoms to a
      GP — "Contact your GP if you think you have symptoms of menopause or
      perimenopause and want to know what your options are" — so
      ROUTINE_APPOINTMENT rather than SELF_CARE. Only normal_variation sits at
      SELF_CARE.

      NHS defines the boundary usefully: "Perimenopause happens when your
      periods become irregular and menopause is when your periods stop
      altogether", and "usually affects women between the ages of 45 and 55".

  # ---------------------------------------------------------------------------
  # The benign and infective alternatives — added 2026-08-04.
  #
  # None of these was in the original fourteen. They were added after auditing
  # what our own sources name as differentials: NHS lists all three as causes of
  # pelvic pain. Without them several existing features point at the wrong
  # condition, which is a worse failure than not modelling them at all.
  # ---------------------------------------------------------------------------
  - id: ovarian_cyst
    label: Ovarian cyst
    icd11: GA18.6
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [medlineplus, womenshealth, nhs]
    note: >-
      Baseline is routine because most cysts are harmless: NHS says they are
      "very common and do not usually cause any symptoms" and that "Most ovarian
      cysts occur naturally and go away in a few months without needing any
      treatment." The dangerous cases — torsion and rupture — are handled by red
      flags, not by the baseline.

      Its real value is explaining `pain_onset: sudden`, which until now had
      nothing to point at. NHS: "An ovarian cyst usually only causes symptoms if
      it splits (ruptures), is very large or twists and then blocks the blood
      supply to the ovaries", with pain that "can range from a dull, heavy
      sensation to a sudden, severe and sharp pain."

  - id: urinary_tract_infection
    label: Urinary tract infection (UTI)
    icd11: GC08.Z
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [medlineplus, womenshealth, nhs]
    note: >-
      The commonest benign cause of pelvic pain with urinary symptoms, and NHS
      names it first among the common causes of pelvic pain. Without it,
      `urinary_symptoms` pushes toward fibroids when the answer is usually far
      simpler — a differential that omits the common explanation will
      systematically over-suspect the rare one.

  - id: sexually_transmitted_infection
    label: Sexually transmitted infection (STI)
    icd11: 1A9Z
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [womenshealth, nhs, medlineplus]
    note: >-
      Included because it is the CAUSE of pelvic inflammatory disease — NHS:
      "Pelvic inflammatory disease (PID) is usually caused by sexually
      transmitted infections (STIs) like chlamydia and gonorrhoea" — and because
      it is what `abnormal_discharge` should point at before anything else.

      Baseline routine rather than urgent: NHS routes to a GP or sexual health
      clinic. It escalates only through PID, which carries the urgent baseline.
      Treated as one condition rather than one per organism: the triage action
      is the same for all of them, and this system decides urgency, not which
      organism.

  # ---------------------------------------------------------------------------
  # The benign causes of discharge — added 2026-08-04.
  #
  # abnormal_discharge previously pointed only at PID, which carries an urgent
  # baseline, and STI. Both serious. The commonest causes of discharge are these
  # two and neither was modelled, so the feature systematically over-triaged.
  # Same reasoning that justified adding urinary_tract_infection.
  # ---------------------------------------------------------------------------
  - id: thrush
    label: Vaginal thrush (yeast infection)
    icd11: 1F23.10
    baseline_action: SELF_CARE
    source_ids: [medlineplus, womenshealth, nhs]
    # ICD-11 indexes this as 'vulvovaginal candidosis'; neither 'thrush' nor
    # 'yeast infection' matches, and the label had to be searched on its
    # clinical name rather than its common one.
    search_term: vulvovaginal candidosis
    note: >-
      ONLY THE SECOND CONDITION WITH A SELF_CARE BASELINE, after
      normal_variation — and unlike that one, this is an actual illness.

      Justified because NHS treats it as self-manageable: thrush is treated with
      pharmacy antifungals without needing an appointment. That makes it the
      first route to SELF_CARE for a user who genuinely has something wrong,
      rather than for a user who has nothing wrong. Worth watching in
      evaluation: a SELF_CARE baseline on a real condition is exactly where
      under-triage would show up if the reasoning is off.

  - id: bacterial_vaginosis
    label: Bacterial vaginosis
    # REVERTED to TODO_VERIFY on 2026-08-04 after a bad match was applied.
    #
    # `make icd` proposed MF3A "Vaginal discharge" with a confidence of 1.00 and
    # it was applied without the proposal being read carefully. MF3A is a
    # SYMPTOM code, not this disease — the search matched on the word "vaginal".
    #
    # Searching "bacterial vaginosis" and "vaginosis" both return the same
    # symptom code, so the MMS linearisation may not carry a distinct entry for
    # it. Left unfilled rather than guessed: a wrong identifier looks
    # authoritative, which is worse than an absent one.
    #
    # THE GENERAL LESSON, worth keeping: the API's confidence score measures
    # string similarity, not conceptual correctness. A score of 1.00 on the
    # wrong concept is exactly what it looks like. Read every proposal before
    # running --apply.
    #
    # UNRESOLVED, not TODO_VERIFY: the difference matters. TODO_VERIFY means
    # "not yet looked up"; UNRESOLVED means "looked up, and the linearisation
    # has no correct entry". `make icd` only proposes for TODO_VERIFY, so this
    # will not be re-proposed and the bad match cannot creep back in.
    icd11: UNRESOLVED
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [womenshealth, nhs]
    note: >-
      Routine rather than self-care because, unlike thrush, it needs prescribed
      antibiotics. The pairing matters more than either condition alone: thrush
      and bacterial vaginosis are the two benign explanations for discharge, and
      distinguishing them from each other is less important here than
      distinguishing both from PID.

  # ---------------------------------------------------------------------------
  # The one documented exception to the two-source rule.
  # ---------------------------------------------------------------------------
  - id: adenomyosis
    label: Adenomyosis
    icd11: GA11
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [nhs]
    single_source_reason: >-
      No second usable source exists. MedlinePlus mentions adenomyosis only in
      link lists pointing at Mayo Clinic, which is copyrighted; NICHD, CDC, the
      Office on Women's Health and WHO have no page at all. NICE CKS covers it
      but its licence is not satisfiable outside the UK.

      Authored anyway because omitting it is the larger error. NHS names
      adenomyosis alongside endometriosis as a cause of heavy and painful
      periods on three separate pages, so it is a differential our own sources
      insist on — and a differential missing a condition the sources keep naming
      will attribute its symptoms to whatever else is available, which here
      means endometriosis.

      The rule's purpose is that no condition rests on a single DOCUMENT. NHS
      covers this across a dedicated page plus the heavy-periods and period-pain
      pages, which meets that purpose while failing the letter of the rule. See
      docs/adr/0006.

      CONSEQUENCE TO STATE WHEREVER COVERAGE IS REPORTED: this is the only
      condition in the knowledge base with no corroborating source. If NHS is
      wrong about something here, nothing catches it.

      RE-PROBED 2026-08-18: medlineplus.gov/adenomyosis.html and
      nichd.nih.gov/health/topics/adenomyosis were both fetched again to check
      whether a dedicated page now exists. Both failed — neither URL resolves.
      The single-source exception stands unchanged; this is recorded so the gap
      is a checked fact as of this date, not an assumption inherited from
      2026-08-04.
    note: >-
      NHS distinguishes it from endometriosis explicitly — "Endometriosis is a
      different condition where tissue similar to the lining of the womb grows
      in other places, such as the ovaries or fallopian tubes" — which is rare
      and useful, since the two present almost identically.

  # ---------------------------------------------------------------------------
  # Not a disease. Included because without it SELF_CARE is unreachable.
  # ---------------------------------------------------------------------------
  - id: normal_variation
    label: Normal menstrual variation
    icd11: NOT_APPLICABLE
    baseline_action: SELF_CARE
    source_ids: [medlineplus, womenshealth]
    note: >-
      The only condition whose baseline is SELF_CARE, and the reason that action
      is reachable at all. Without it every path through the differential ends
      at a doctor, and the system routes a healthy user to care every time —
      which would show up in evaluation as near-total over-triage on normal
      cases, indistinguishable from a fault in the elimination logic.

      Grounded rather than assumed. MedlinePlus gives the ranges: "Most
      menstrual cycles last about 28 days, but cycles can be shorter or longer
      and still be normal" and "A period usually lasts three to seven days and
      can be light or heavy". The Office on Women's Health states the two-way
      version in one sentence: "Regular menstrual periods in the years between
      puberty and menopause are usually a sign that your body is working
      normally. Irregular or heavy, painful periods are not normal."

      icd11 is NOT_APPLICABLE rather than TODO_VERIFY: there is no code for not
      being ill, so leaving TODO_VERIFY would imply a lookup that will never
      resolve.

  - id: uterine_fibroids
    label: Uterine fibroids
    icd11: 2E86.0
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [medlineplus, nichd]
    note: >-
      MedlinePlus: "Many women with fibroids have no symptoms. If you do, the
      type of symptoms may be due to location, size, and number of fibroids",
      listing "Heavy or painful periods or bleeding between periods" and
      "Feeling 'full' in the lower abdomen (belly)". The asymptomatic majority
      matters for elimination: absence of symptoms argues against far less
      strongly here than it would for a condition that is always symptomatic.
      NICHD supplies symptom, cause and treatment pages under conditioninfo/.

  # ---------------------------------------------------------------------------
  # Thirteenth condition, added 2026-08-19. First of the "unblocked" set named
  # in the current data-generation task — sources confirmed on womenshealth.gov
  # on 2026-08-17, two-source rule checked against MedlinePlus/NICHD/CDC per
  # condition rather than assumed from the womenshealth 200 alone.
  # ---------------------------------------------------------------------------
  - id: hypothyroidism
    label: Hypothyroidism (underactive thyroid)
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [womenshealth, medlineplus]
    note: >-
      Two sources, independently checked: womenshealth.gov/a-z-topics/thyroid-
      disease was named unblocked by the task; medlineplus.gov/hypothyroidism
      .html was then probed and confirmed to exist (2026-08-19), satisfying the
      two-source rule rather than assuming it from the womenshealth 200 alone.
      The two corroborate each other closely — both name heavy/irregular
      periods and fertility problems as menstrual-cycle effects, which is what
      makes this condition relevant to the differential at all.

      womenshealth: "Too much or too little thyroid hormone can make your
      periods very light, heavy, or irregular. Thyroid disease also can cause
      your periods to stop for several months or longer, a condition called
      amenorrhea." And on symptoms specifically: "Weight gain, even though you
      are not eating more food" and "More than usual menstrual bleeding".
      MedlinePlus corroborates: "Heavy or irregular menstrual periods" and
      "Fertility problems in women", and adds the mechanism womenshealth
      states only in passing — "Because hypothyroidism develops slowly, many
      people don't notice symptoms of the disease for months or even years."

      baseline_action is ROUTINE_APPOINTMENT: neither source frames
      hypothyroidism itself as requiring urgent care — MedlinePlus's only
      escalation-adjacent language is about untreated, longstanding cases
      ("In rare cases, untreated hypothyroidism can cause myxedema coma"),
      which is a longstanding-complication statement, not the kind of
      explicit "seek care now" language red_flags.yaml requires, and is in any
      case far too rare and far too removed from a presenting symptom to
      justify a red flag.

      Deliberately NOT modelled alongside hyperthyroidism, thyroiditis,
      goitre, thyroid nodules or thyroid cancer, all of which the womenshealth
      page also covers at length. hypothyroidism is the one this task named,
      it is the one with the clearest, most specific menstrual-symptom
      language, and adding the others would repeat the STI over-splitting
      question the task explicitly ruled out for a different condition — one
      more organ system's worth of sub-conditions competing for the same
      handful of menstrual-cycle features. Thyroid cancer specifically is
      excluded on the same policy as womb and ovarian cancer: CLAUDE.md's
      "cancers are deliberately absent" applies here without needing a
      separate argument.

  - id: primary_ovarian_insufficiency
    label: Primary ovarian insufficiency (early or premature menopause)
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [womenshealth, medlineplus]
    note: >-
      Two sources, independently checked: womenshealth.gov/menopause/early-
      or-premature-menopause was named unblocked by the task; medlineplus
      .gov/prematureovarianfailure.html was probed and confirmed (2026-08-19).

      CONFLICT BETWEEN THE TWO SOURCES, recorded here rather than resolved
      silently — build/conflicts.jsonl is referenced throughout this repo's
      docs as the place such conflicts are logged, but no pipeline stage
      currently writes to it (it is described only as a future `make build`
      artefact in docs/CODE_GUIDE.md); this note is the durable, git-tracked
      record until that tooling exists.

      womenshealth treats "premature menopause" and "primary ovarian
      insufficiency" as the SAME thing: "Menopause that happens before age 40
      is called premature menopause (which is also medically called primary
      ovarian insufficiency [POI])." MedlinePlus explicitly says they are
      DIFFERENT: "POI is different from premature menopause... With POI, some
      women still have occasional periods. They may even get pregnant,"
      whereas premature menopause is a harder stop — periods end and
      pregnancy is no longer possible with one's own eggs.

      RESOLUTION: authored as one condition under the id and framing the task
      specified (primary_ovarian_insufficiency, sourced from the womenshealth
      URL the task named), because the two sources describe overlapping
      populations under a shared or near-shared clinical picture — irregular
      or missed periods, before age 40 — even though they disagree on whether
      "premature menopause" is the same label or a stricter subtype. This is
      not the same kind of conflict red_flags.yaml resolves by taking the
      higher urgency (both sources agree on urgency — routine, see a
      provider), it is a definitional disagreement, so there is no "more
      severe wins" tie-break available. The practical consequence for the
      evidence grid is small: both sources agree closely on the SYMPTOM
      picture (irregular/missed periods before 40, menopause-like symptoms),
      which is what the evidence rows in this condition's batch draw on, and
      neither source's symptom claims are contingent on which definitional
      reading is correct. But a future author extending this condition should
      know the two sources are not simply restating each other here.

      Distinguished from perimenopause by AGE ALONE, the same mechanism that
      already separates perimenopause from pcos: age_band under_20/20_to_29/
      30_to_39 vs perimenopause's 45_to_54. MedlinePlus: "sometimes POI can
      start as early as the teenage years," and womenshealth: "About 5% of
      women naturally go through early menopause," describing the same
      symptom picture at a younger age than the natural-menopause baseline.

      baseline_action is ROUTINE_APPOINTMENT for the same reason as
      hypothyroidism and perimenopause: neither source frames this as
      requiring urgent care on its own, only ongoing management once
      diagnosed.

  - id: inherited_bleeding_disorder
    label: Inherited bleeding disorder (e.g. Von Willebrand disease)
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [womenshealth, medlineplus]
    note: >-
      Two sources: womenshealth.gov/a-z-topics/bleeding-disorders, unblocked
      by the task; medlineplus.gov/bleedingdisorders.html, probed and
      confirmed 2026-08-19 after two guessed URLs for a dedicated Von
      Willebrand disease page (vonwillebranddisease.html,
      vonwillebranddiseases.html) both 404'd — the general bleeding-disorders
      topic page resolved instead. MedlinePlus's page is mostly a link hub
      with only a Summary section of real prose, corroborating the mechanism
      (platelets and clotting factors) without repeating womenshealth's
      symptom detail. This asymmetry mirrors pcos and endometriosis, both of
      which already rest more heavily on one source than the other while
      meeting the two-source rule.

      womenshealth: "Von Willebrand disease (VWD) is the most common type of
      bleeding disorder in women" and, on VWD specifically, "Unusually heavy
      and long menstrual periods (this is the most common symptom)." Also:
      "As many as one in 10 women with heavy menstrual periods may have a
      bleeding disorder" — a real, named fill for `bleeding_heaviness`, which
      until now pointed only at chronic gynaecological conditions and
      hypothyroidism.

      Modelled as ONE condition covering the class of inherited bleeding
      disorders (Von Willebrand disease being the named common example),
      rather than a separate condition per named disorder (VWD, haemophilia
      carriers). Same reasoning CLAUDE.md gives for keeping
      sexually_transmitted_infection as one condition rather than splitting
      by organism: womenshealth gives every named subtype the same baseline
      urgency and largely the same menstrual-bleeding presentation, so
      splitting would multiply authoring without changing any triage outcome.

      baseline_action is ROUTINE_APPOINTMENT: neither source frames a
      bleeding disorder itself as requiring urgent care — the urgency in this
      differential already comes from bleeding_heaviness=soaking_hourly and
      the existing heavy-bleeding red flags, which this condition's evidence
      feeds into rather than duplicating.

  # ---------------------------------------------------------------------------
  # New differential, not from the "unblocked" list — fills a real hole. Once
  # urinary_tract_infection is excluded, urinary_symptoms and
  # pain_opening_bowels_or_urinating had nowhere else to point.
  # ---------------------------------------------------------------------------
  - id: bladder_pain
    label: Bladder pain syndrome (interstitial cystitis)
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [womenshealth, medlineplus]
    note: >-
      Two sources: womenshealth.gov/a-z-topics/bladder-pain, one of the
      task's named new differentials; medlineplus.gov/interstitialcystitis
      .html, probed and confirmed on the first guess (2026-08-19) — "bladder
      pain syndrome" and "interstitial cystitis" are the same condition under
      two names, and MedlinePlus indexes it under the clinical name, the same
      naming mismatch already documented for pcos/PMOS in CONTEXT.md.

      THE HOLE THIS FILLS, stated directly by womenshealth: "Bladder pain
      syndrome is often mistaken for a urinary tract infection (UTI)... But
      bladder pain syndrome and UTIs are not the same health problem...
      Bladder pain syndrome cannot be treated with antibiotics." Without this
      condition, urinary_symptoms and pain_opening_bowels_or_urinating had
      nowhere to point once urinary_tract_infection is excluded — exactly the
      gap the task named, and exactly the same shape of gap that justified
      adding urinary_tract_infection, thrush and bacterial_vaginosis in the
      first place (see CLAUDE.md's "the benign and infective alternatives").

      baseline_action is ROUTINE_APPOINTMENT: chronic, not urgent — "There is
      no cure, but there is treatment to help relieve your symptoms" —
      matching every other chronic condition's baseline in this knowledge
      base.

  # ---------------------------------------------------------------------------
  # New differential, not from the "unblocked" list — fills a real hole.
  # abdominal_swelling_or_pressure had no non-mass explanation.
  # ---------------------------------------------------------------------------
  - id: pelvic_organ_prolapse
    label: Pelvic organ prolapse
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [womenshealth, nichd]
    note: >-
      Two sources: womenshealth.gov/a-z-topics/pelvic-organ-prolapse, one of
      the task's named new differentials; nichd.nih.gov/health/topics/
      pelvicfloor, probed and confirmed (2026-08-19) after two guessed
      MedlinePlus URLs (pelvicorganprolapse.html, uterineprolapse.html) both
      404'd. NICHD's page is thin — two short paragraphs on the general topic
      of pelvic floor disorders, not a dedicated prolapse page — but it is
      real, on-topic prose corroborating womenshealth's core mechanism claim,
      not a content-free hub like the one found and rejected for
      pregnancy_related_bleeding. This condition rests far more heavily on
      womenshealth, the same asymmetry already documented for endometriosis
      ("NICHD has no conditioninfo section... its topic page is a single
      paragraph").

      THE HOLE THIS FILLS, per the task: abdominal_swelling_or_pressure
      currently has no explanation beyond a mass condition (fibroids,
      ovarian_cyst, adenomyosis). womenshealth: "The pressure from prolapse
      can cause a bulge in the vagina... A feeling of pressure, discomfort,
      aching, or fullness in the pelvis" — a genuinely different mechanism
      (structural support failure, not a growth) producing the same reported
      symptom, which is exactly the kind of alternative explanation this
      differential was missing.

      baseline_action is ROUTINE_APPOINTMENT: "pelvic organ prolapse is
      treatable" — no urgent-care framing in either source.

  # ---------------------------------------------------------------------------
  # New differential, not from the "unblocked" list — fills a real hole.
  # anaemia_symptoms is thinly supported without this condition to point at.
  # ---------------------------------------------------------------------------
  - id: iron_deficiency_anaemia
    label: Iron-deficiency anaemia
    baseline_action: ROUTINE_APPOINTMENT
    source_ids: [womenshealth, medlineplus]
    note: >-
      Two sources: womenshealth.gov/a-z-topics/iron-deficiency-anemia, one of
      the task's named new differentials; medlineplus.gov/anemia.html, probed
      and confirmed (2026-08-19) after a guessed dedicated page
      (irondeficiencyanemia.html) 404'd. MedlinePlus's page covers anaemia
      generally rather than the iron-deficiency form specifically, but names
      iron deficiency as "the most common cause of anemia" in its own opening
      sentence, and the symptom picture the two sources describe corroborates
      closely — this is not the same kind of thin-hub problem found and
      rejected for pregnancy_related_bleeding, it is a slightly broader-scope
      page that still substantively covers this condition.

      THE HOLE THIS FILLS, per the task: anaemia_symptoms currently supports
      only inherited_bleeding_disorder (batch_19) and correlates loosely with
      extreme_tiredness across several conditions, but has no condition of
      its own where anaemia IS the primary presentation rather than a
      secondary complication of heavy bleeding. womenshealth states the
      mechanism directly and names heavy menstrual periods as a leading
      cause: "Have heavy menstrual periods. Up to 5% of women of childbearing
      age develop iron-deficiency anemia because of heavy bleeding during
      their periods."

      baseline_action is ROUTINE_APPOINTMENT: both sources frame this as a
      manageable condition ("Treatment for iron-deficiency anemia depends on
      the cause") with no urgent-care framing for ordinary presentation —
      the one escalation-adjacent sentence found ("If you have severe
      bleeding or symptoms of chest pain or shortness of breath, your doctor
      may recommend iron or red blood cell transfusions") describes a rare
      treatment pathway, not "seek care now" language, and in any case chest
      pain and severe bleeding already have their own coverage elsewhere in
      this knowledge base (severe_pelvic_pain and the heavy-bleeding red
      flags) rather than needing a new rule keyed on this condition.


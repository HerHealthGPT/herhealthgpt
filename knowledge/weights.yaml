# weights.yaml — tunable constants for the stopping controller.
#
# ============================================================================
# EVERY NUMBER IN THIS FILE WAS CHOSEN BY US.
#
# None of it is measured, derived from a source, or clinically validated. These
# are the knobs that turn the ordinal evidence scale into something a controller
# can add up, set to defensible starting values and expected to move once the
# evaluation set gives us something to tune against.
#
# Do not cite these numbers. Do not describe them as calibrated. When they
# change, the change belongs in a commit of its own with the evaluation result
# that motivated it, so the two can be read together later.
# ============================================================================
#
# Validated against herhealth_contracts.knowledge.Weights, which refuses to
# load this file if the scale is not monotonic or if the SELF_CARE bar is not
# strictly higher than the routine bar.

# ---------------------------------------------------------------------------
# The ordinal scale, in log-odds
# ---------------------------------------------------------------------------
# Each answer adds the matching value to the running score of every condition
# that has a row for it. `neutral` is pinned to 0.0 and never appears in
# evidence.csv — a neutral row is an omitted row.
#
# WHY THESE VALUES. Adding log-odds is the same as multiplying odds, so every
# weight below reads as a plain multiplier — exp(w):
#
#     strong_support  +1.5  ->  x4.5  "about four and a half times more likely"
#     weak_support    +0.6  ->  x1.8  "about twice as likely"
#     neutral          0.0  ->  x1    changes nothing, so the row is omitted
#     argues_against  -0.5  ->  /1.6  "about one and a half times less likely"
#     rules_out       -4.0  ->  /55   "far less likely"
#
# Those multipliers are not our taste. They sit on the conventional bands used
# in evidence-based medicine for grading how far a diagnostic finding shifts
# belief: ~2x is a small but sometimes important increase, ~5x is moderate,
# ~0.5x is a small decrease, and below 0.1x is a large decrease.
#
# NOTE WHAT IS AND IS NOT BEING CLAIMED. We do NOT claim any row has a measured
# likelihood ratio — no source gives us one, and writing a number on a row would
# be inventing evidence. The claim is about the RULER: the spacing of this
# five-point scale follows a published convention rather than our preference.
# Rows stay ordinal. A row says `strong_support`, never `4.5`.
#
# There is deliberately NO "conclusive" level (~10x). The strongest support this
# system can express is moderate, because one sentence from a public health page
# is not conclusive evidence of anything.
#
# This reading only holds because plausibility is an independent logistic. Under
# a softmax the weights would mean something different depending on what every
# other condition scored. See docs/adr/0005 and docs/KNOWLEDGE_BASE.md §6a.
log_odds:
  # A source describes this as a main or characteristic sign.
  # x4.5 — the conventional "moderate increase" band.
  strong_support: 1.5

  # A source lists it among the features of the condition.
  # x1.8 — the conventional "small but sometimes important" band.
  weak_support: 0.6

  # Pinned. The absence of evidence, not evidence of absence.
  neutral: 0.0

  # A source explicitly frames this as distinguishing, excluding, or
  # characteristic of an alternative.
  #
  # Deliberately WEAKER in magnitude than weak_support. The system should
  # accumulate belief faster than it eliminates, because wrongly dropping a
  # condition costs more than asking one more question. Making this symmetric
  # (-0.6) is the first tuning experiment worth running.
  argues_against: -0.5

  # Counts very heavily against, and eliminates a condition on its own FROM A
  # STANDING START: -4.0 clears the -2.94 floor.
  #
  # It does NOT eliminate regardless of accumulated support, which this comment
  # used to claim. Weights simply add, so a rules_out row only reaches the floor
  # when prior support is below +1.06 log-odds — and a single strong_support row
  # (+1.5) already exceeds that:
  #
  #     nothing       +0.0 -4.0 = -4.0 -> 0.018   eliminated
  #     1 weak        +0.6 -4.0 = -3.4 -> 0.032   eliminated
  #     1 strong      +1.5 -4.0 = -2.5 -> 0.076   SURVIVES
  #     2 strong      +3.0 -4.0 = -1.0 -> 0.269   SURVIVES
  #
  # Harmless today — evidence.csv has zero rules_out rows. BEFORE AUTHORING THE
  # FIRST ONE, read docs/adr/0009: the choice between making elimination
  # absolute and leaving it additive has to be made then, not discovered later.
  rules_out: -4.0

# ---------------------------------------------------------------------------
# Thresholds, on the plausibility scale (0.0 to 1.0)
# ---------------------------------------------------------------------------
#
# HOW THESE RELATE TO THE WEIGHTS ABOVE.
#
# The weights are log-odds and accumulate additively. Plausibility is an
# INDEPENDENT LOGISTIC of a condition's own score — not a softmax across
# conditions:
#
#     plausibility = 1 / (1 + exp(-log_odds))
#
# Conditions therefore do not compete for a fixed total, and all of them may be
# implausible at once. That is the point: a softmax normalises to 1 whatever it
# is given, so a user with an unmodelled condition would still see the least-bad
# condition emerge with high plausibility. Given normal_variation carries a
# SELF_CARE baseline, that would be under-triage manufactured by the arithmetic.
# See docs/adr/0005 and packages/contracts/src/herhealth_contracts/scoring.py.
#
# In the units the controller actually adds:
#
#     plausibility_floor         0.05  =  -2.94 log-odds
#     stop_confidence            0.65  =  +0.62 log-odds
#     self_care_stop_confidence  0.85  =  +1.73 log-odds
#     no evidence at all          0.5  =   0.00 log-odds
#
# Weights.plausibility_floor_log_odds and friends expose these, so a threshold
# can be checked against the weights rather than eyeballed.
#
# KNOWN TUNING PROBLEM, recorded rather than quietly fixed. Converting these
# revealed that the bars are low relative to the weights:
#
#     one weak_support  (+0.6)  ->  0.646   just under the 0.65 routine bar
#     one strong_support(+1.5)  ->  0.818   clears it comfortably
#
# So a SINGLE strong row can satisfy stop_confidence and stop the controller
# asking. That is probably too eager — it risks concluding before reaching a
# feature that would have changed the action. Raising stop_confidence toward
# 0.90 (+2.20, roughly two rows) is the obvious candidate, but the number should
# be set by the evaluation set rather than by argument. Flagged in the phase 1
# summary as the first tuning experiment.

# Below this, a condition is no longer live: it stops driving question
# selection and stops counting toward "do all live conditions share an action".
# Too high and rare conditions vanish before they can be asked about; too low
# and the controller keeps asking questions to separate conditions nobody
# believes in.
plausibility_floor: 0.05

# How confident the top condition must be before the controller stops, for
# ROUTINE_APPOINTMENT, URGENT_SAME_DAY and EMERGENCY.
stop_confidence: 0.65

# The same bar for concluding SELF_CARE — strictly higher, and enforced as
# such by the schema.
#
# This is the single most important number in the file. Under-triage is the
# dominant failure mode: on the benchmark that motivated this architecture,
# 72% of cases whose correct answer was "see a doctor" were routed to
# "routine". Concluding "nothing to do" is the conclusion most costly to get
# wrong, so it has to be the hardest to reach.
self_care_stop_confidence: 0.85

# How far clear of the runner-up the top condition must be. Guards against
# stopping while two conditions with different actions are still neck and neck.
stop_margin: 0.15

# Hard ceiling on questions before stopping and returning the differential.
# One question per turn, always. Six is a judgement about how much patience a
# user has, not a statistical result.
max_questions: 6

note: >-
  Starting values, not calibrated. Tune against the evaluation set and record
  the result alongside any change. Red-flag recall must stay at 100% through
  any retuning; it is gated in CI and is not traded off against question count.
